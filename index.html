<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#130d20"><link rel="manifest" href="manifest.json"><title>Мой дом ❤️</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0712;color:#ffeaf2;font-family:Georgia,serif}
body{overflow-x:hidden;background:radial-gradient(circle at 50% 15%,#4b2340,#130d20 48%,#08060d)}
.app{max-width:720px;margin:auto;min-height:100vh;padding:18px 14px 40px}.top{text-align:center;padding:12px 5px}
.crown{font-size:38px;filter:drop-shadow(0 0 12px #ff8bb7)}h1{font-size:clamp(30px,8vw,48px);margin:8px 0;color:#ffb8d0;text-shadow:0 0 18px #ff6090}.sub{opacity:.85;line-height:1.5}
.house-wrap{perspective:1200px;margin:15px auto 8px;max-width:620px}.house{position:relative;height:520px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 25px 30px #0009)}
.roof{position:absolute;top:0;left:9%;width:82%;height:100px;background:linear-gradient(135deg,#ff86ad,#8f315d);clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:10px;box-shadow:0 0 35px #ff5d9a55}
.floor{position:absolute;left:8%;width:84%;height:91px;background:linear-gradient(135deg,#f8d6d5,#bd7892);border:3px solid #ffbed2;box-shadow:inset 0 0 35px #ffb0c433,0 10px 18px #0007;border-radius:8px;overflow:hidden;cursor:pointer;transition:.35s}
.floor:hover{transform:translateZ(20px);box-shadow:0 0 28px #ff7eae99}.floor.active{outline:3px solid #fff2f7;box-shadow:0 0 35px #ff6faaa8}
.floor:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 40%,#ffd8a866,transparent 40%);pointer-events:none}
.f0{top:88px}.f1{top:180px}.f2{top:272px}.f3{top:364px}.f4{top:456px;height:64px}
.window{position:absolute;left:8%;top:18%;width:19%;height:65%;border-radius:12px;background:#4b2940;border:3px solid #ffe1df;box-shadow:0 0 15px #ffd07e}.window:after{content:"";position:absolute;inset:45% 0 0;border-top:2px solid #ffe1df}
.room{position:absolute;left:32%;top:12%;font-size:13px;color:#5d2941}.emoji{font-size:30px;display:block;margin-bottom:2px}
.f4 .room{top:7%}.door{position:absolute;right:10%;bottom:0;width:20%;height:82%;background:#7e3f52;border:3px solid #f6c0ca;border-radius:12px 12px 0 0}
.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}.btn{border:1px solid #e889ab;background:#ff729f;color:white;border-radius:999px;padding:11px 15px;font-weight:bold}.btn.alt{background:#27152a;color:#ffc5d7}
.panel{background:#160d1dcd;border:1px solid #7e3b5d;border-radius:25px;padding:20px;box-shadow:0 15px 35px #0008;backdrop-filter:blur(10px)}.panel h2{text-align:center;color:#ffb5cc;margin-top:0}.content{min-height:190px;text-align:center;line-height:1.65}.letter{font-size:19px}.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}.heart{position:absolute;bottom:-30px;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}@media(max-width:480px){.house{height:440px}.f0{top:75px}.f1{top:152px}.f2{top:229px}.f3{top:306px}.f4{top:383px;height:57px}.floor{height:76px}.f4{height:57px}.room{font-size:11px}.emoji{font-size:23px}}
</style>
</head>
<body><div class="hearts" id="hearts"></div><main class="app">
<header class="top"><div class="crown">👑</div><h1>Для моей любимой принцессы</h1><div class="sub">Добро пожаловать в наш маленький домик любви.<br>Нажимай на этажи и открывай наши истории ❤️</div></header>
<section class="house-wrap"><div class="house" id="house">
<div class="roof"></div>
<div class="floor f0 active" data-id="0"><div class="window"></div><div class="room"><span class="emoji">💌</span>Письмо для тебя</div><div class="door"></div></div>
<div class="floor f1" data-id="1"><div class="window"></div><div class="room"><span class="emoji">📖</span>Наша история</div><div class="door"></div></div>
<div class="floor f2" data-id="2"><div class="window"></div><div class="room"><span class="emoji">💗</span>Почему я тебя люблю</div><div class="door"></div></div>
<div class="floor f3" data-id="3"><div class="window"></div><div class="room"><span class="emoji">📸</span>Наши воспоминания</div><div class="door"></div></div>
<div class="floor f4" data-id="4"><div class="window"></div><div class="room"><span class="emoji">✨</span>Наши мечты</div></div>
</div></section>
<nav class="nav"><button class="btn alt" onclick="prev()">← Предыдущий</button><button class="btn" onclick="next()">Следующий этаж →</button></nav>
<section class="panel"><div class="content" id="content"></div><div class="nav">
<button class="btn" id="photos">📸 Добавить фото</button><button class="btn alt" id="install">🏠 На экран домой</button>
</div><input id="file" type="file" accept="image/*" multiple hidden><p id="hint" style="text-align:center;font-size:12px;opacity:.7"></p></section>
</main>
<script>
const data=[
['Письмо для тебя',`<div class="letter">Моя самая любимая принцесса!<br><br>Это место я создал для тебя — маленький дом, в котором живут наши воспоминания, мечты и всё самое тёплое.<br><br>Открывай этажи, когда захочешь почувствовать мою любовь. ❤️<br><br><i>Твой ❤️</i></div>`],
['Наша история',`Здесь можно рассказать вашу историю: как вы встретились, первое свидание, первый поцелуй и моменты, которые хочется помнить всегда.<br><br>Добавь даты и подписи — и домик станет вашей личной хроникой.`],
['Почему я тебя люблю',`💗 За твою улыбку<br>💗 За то, как ты меня понимаешь<br>💗 За твою нежность<br>💗 За твой характер<br>💗 За то, что рядом с тобой я — настоящий<br><br><b>И просто потому, что это ты.</b>`],
['Наши воспоминания',`Выбери фотографии кнопкой ниже. Они появятся в этом разделе и сохранятся на устройстве.<div id="pics" class="nav"></div>`],
['Наши мечты',`✨ Путешествия вдвоём<br>🌅 Встречать рассветы<br>🏡 Наш уютный дом<br>🐾 Завести маленького любимца<br>💍 Создавать нашу семью<br><br><b>Самая красивая часть истории — ещё впереди.</b>`]
];
let current=0;let deferred;
const floors=[...document.querySelectorAll('.floor')], content=document.getElementById('content');
function render(){floors.forEach(x=>x.classList.toggle('active',+x.dataset.id===current));content.innerHTML='<h2>'+data[current][0]+'</h2>'+data[current][1];if(current===3)loadPics()}
function go(n){current=(n+5)%5;render();window.scrollTo({top:0,behavior:'smooth'})}function next(){go(current+1)}function prev(){go(current-1)}
floors.forEach(f=>f.onclick=()=>go(+f.dataset.id));render();
document.getElementById('photos').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{const fs=[...e.target.files];fs.forEach(f=>{const r=new FileReader();r.onload=x=>{let a=JSON.parse(localStorage.getItem('pics')||'[]');a.push(x.target.result);localStorage.setItem('pics',JSON.stringify(a));if(current===3)render()};r.readAsDataURL(f)})};
function loadPics(){const p=document.getElementById('pics');(JSON.parse(localStorage.getItem('pics')||'[]')).forEach(x=>{const im=new Image();im.src=x;im.style.cssText='width:110px;height:110px;object-fit:cover;border-radius:18px;border:2px solid #ffb5cc';p.appendChild(im)})}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
document.getElementById('install').onclick=async()=>{if(deferred){deferred.prompt();deferred=null}else{document.getElementById('hint').textContent='iPhone: Safari → Поделиться → «На экран Домой». Android: меню браузера → «Добавить на главный экран».'}};
setInterval(()=>{let h=document.createElement('div');h.className='heart';h.textContent=['❤','💕','✨','🌸'][Math.floor(Math.random()*4)];h.style.left=Math.random()*100+'vw';h.style.fontSize=12+Math.random()*18+'px';h.style.animationDuration=5+Math.random()*5+'s';document.getElementById('hearts').appendChild(h);setTimeout(()=>h.remove(),11000)},900);
</script></body></html>
